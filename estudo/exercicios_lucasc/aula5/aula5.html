<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aula 05 - Meu componente: Botao</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; }

        .botoes { display: flex; gap: 10px; }
        .botao { padding: 11px 18px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
        .botao.confirmar { background: #dc2626; color: #fff; border: 1px solid #dc2626; }
        .botao.voltar { background: #fff; color: #1f2033; border: 1px solid #d9d8e8; }
    </style>
</head>
<body>
    <!-- Outros pedaços da tela ficam como div simples, só para o meu componente aparecer no lugar certo -->
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        // Dados fixos, no formato do treino da API (sem API por enquanto)
        const treino = { id: 1, nome: "Corrida leve", duracao: 35 };

        // Os botões de baixo da tela "Excluir treino". Dados fixos num array:
        const botoes = [
            { id: 1, texto: "Sim, excluir", tipo: "confirmar" },
            { id: 2, texto: "Voltar", tipo: "voltar" }
        ];

        // MEU COMPONENTE - Botao (Sim, excluir / Voltar) LUCAS CANTELLI
        function Botao(props) {
            return (
                <button type="button" className={"botao " + props.tipo}>
                    {props.texto}
                </button>
            );
        }

        // MEU COMPONENTE - BotoesDeBaixo: lista de botões com map e key
        function BotoesDeBaixo(props) {
            return (
                <div className="botoes">
                    {props.botoes.map((b) => (
                        <Botao key={b.id} texto={b.texto} tipo={b.tipo} />
                    ))}
                </div>
            );
        }

        function App() {
            return (
                <div>
                    {/* Pedaço dos outros integrantes (div simples) */}
                    <div>Excluir treino</div>
                    <div>Cartão: {treino.nome} ({treino.duracao} min)</div>
                    {/* Só mostra os botões quando há botões: ternário */}
                    {botoes.length > 0 ? <BotoesDeBaixo botoes={botoes} /> : <p>Sem ações</p>}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
