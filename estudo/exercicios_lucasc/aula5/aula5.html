<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Componente Botão</title>
    <!-- React e Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #fff; }
        
        /* Estilos do Botão */
        .botao { 
            padding: 8px 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px;
        }
        .botao.branco { 
            background: white; 
            color: #333; 
            border: 1px solid #ccc; 
        }
        .botao.vermelho { 
            background: #dc2626; 
            color: white; 
            border: none; 
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        // MEU COMPONENTE - cancelar e excluir LUCAS CANTELLI
        function Botao(props) {
            return (
                <button className={`botao ${props.tipo}`}>
                    {props.texto}
                </button>
            );
        }

        function App() {
            return (
                <div style={{display: 'flex', gap: '10px'}}>
                    <Botao texto="Cancelar" tipo="branco" />
                    <Botao texto="Excluir" tipo="vermelho" />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
