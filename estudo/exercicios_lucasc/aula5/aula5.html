<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Yoio - Criar conta</title>
<style>
  body {
    background: #1b1a55;
    font-family: sans-serif;
  }
  .cartao {
    background: #b9a4f0;
    width: 280px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 20px;
  }
  h2 {
    text-align: center;
    color: white;
  }
  label {
    display: block;
    margin: 16px 0;
    color: #4b2a9b;
    font-weight: bold;
  }
  .google {
    width: 100%;
    padding: 8px;
  }
  .botoes {
    text-align: center;
    margin-top: 20px;
  }
  .botoes button {
    padding: 10px 20px;
    background: gold;
  }
</style>
</head>
<body>

<div class="cartao">
  <h2>CRIAR CONTA</h2>

  <label>NOME: <input type="text"></label>
  <label>SENHA: <input type="password"></label>

  <button class="google">ENTRAR COM GOOGLE</button>
</div>

<div class="botoes">
  <button>ENTRAR</button>
  <button>COMEÇAR</button>
</div>

</body>
</html>
