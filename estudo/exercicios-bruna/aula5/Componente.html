<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino</title>
<style>
.acao { display: flex; gap: 14px; }

.link {
  background: none;
  border: none;
  padding: 0;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.link-excluir {
  color: #dc2626;
  background: #fef2f2;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 8px 14px;
  transition: background 0.2s, border-color 0.2s;
}

.link-excluir:hover {
  background: #fee2e2;
  border-color: #dc2626;
}
</style>
</head>

<body>
  <div class="acao">
    <button type="button" class="link link-excluir">
      Excluir
    </button>
  </div>
</body>

</html>
