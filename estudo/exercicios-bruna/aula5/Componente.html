
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Excluir treino</title>
</head>
<body>

  <button
    onclick="excluirTreino()"
    style="
      background: none;
      border: none;
      color: red;
      padding: 0;
      font-size: 16px;
      cursor: pointer;
    "
  >
    Excluir
  </button>

  <script>
    async function excluirTreino() {
      // Informe aqui o ID real do treino que deseja excluir.
      const id = 1;

      try {
        const resposta = await fetch(
          `http://localhost:3000/treinos/${id}`,
          {
            method: 'DELETE',
            credentials: 'include'
          }
        );

        if (resposta.status === 401) {
          alert('Faça login novamente.');
          return;
        }

        if (!resposta.ok) {
          alert('Não foi possível excluir o treino.');
          return;
        }

        alert('Treino excluído com sucesso!');
      } catch (erro) {
        alert('Erro ao conectar com a API.');
      }
    }
  </script>

</body>
</html>
