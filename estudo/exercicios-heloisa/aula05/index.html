
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yoio - Aprendizado Interativo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f3fa;
      color: #34304f;
      margin: 0;
      padding: 24px;
    }

    header {
      background-color: #5546a5;
      color: white;
      padding: 28px;
      border-radius: 16px;
    }

    .destaque {
      background-color: #e5e0ff;
      color: #44377f;
      padding: 20px;
      margin: 20px 0;
      border-radius: 14px;
    }

    li {
      margin: 14px 0;
    }

    .feita {
      color: #25845b;
      font-weight: bold;
    }

    .pendente {
      color: #c17b25;
      font-weight: bold;
    }

    h1, h2 {
      margin-top: 0;
    }

    main {
      max-width: 900px;
      margin: 25px auto;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const projeto = "Yoio";

    const tarefas = [
      {
        id: 1,
        texto: "Planejar as atividades educativas",
        feita: true
      },
      {
        id: 2,
        texto: "Criar desafios de memória e raciocínio",
        feita: false
      },
      {
        id: 3,
        texto: "Adicionar novas fases ao jogo",
        feita: false
      }
    ];

    function Cabecalho() {
      return (
        <header>
          <h1>{projeto}</h1>
          <p>Descobrir, aprender e evoluir!</p>
          <p>Uma nova maneira de transformar o aprendizado em diversão.</p>
        </header>
      );
    }

    function Cartao() {
      return (
        <div className="destaque">
          <h2>Conheça o Yoio</h2>
          <p>
            O Yoio é uma plataforma educativa que oferece
            atividades interativas para ajudar crianças
            a desenvolver habilidades cognitivas.
          </p>
          <p>
            Por meio de jogos e desafios, buscamos tornar
            o ensino mais divertido, inclusivo e acessível.
          </p>
        </div>
      );
    }

    function Lista() {
      return (
        <section>
          <h2>Etapas de desenvolvimento</h2>

          <ul>
            {tarefas.map((t) => (
              <li key={t.id}>
                {t.texto}{" "}
                <span className={t.feita ? "feita" : "pendente"}>
                  {t.feita ? "(feita)" : "(pendente)"}
                </span>
              </li>
            ))}
          </ul>
        </section>
      );
    }

    function App() {
      return (
        <>
          <Cabecalho />
          <main>
            <Cartao />
            <Lista />
          </main>
        </>
      );
    }

    ReactDOM.createRoot(
      document.getElementById("root")
    ).render(<App />);
  </script>
</body>
</html>

<!--1. Expressão é algo que produz um valor, enquanto comando executa uma ação. Exemplo de expressão: `tarefa.feita ? "(feita)" : "(pendente)"`. Exemplo de comando: `const projeto = "Yoio"`.

2. O erro mais difícil de entender foi colocar um `if` dentro das chaves, porque JSX aceita expressões, mas não comandos diretamente.-->
