<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão de Atividade</title>
    
  
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .cartao {
            background-color: #ffffff;
            padding: 20px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 400px;
        }
        .info h2 {
            margin: 0 0 4px 0;
            color: #222;
            font-size: 20px;
        }
        .info p {
            margin: 0;
            color: #666;
            font-size: 16px;
        }
        .acoes {
            display: flex;
            gap: 16px;
        }
        .btn-editar {
            background: none;
            border: none;
            color: #2563eb;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }
        .btn-excluir {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
        }
        .btn-editar:hover, .btn-excluir:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>


    <div id="root"></div>


    <script type="text/babel">
    
        function CardAtividade(props) {
            return (
                <div className="cartao">
                    <div className="info">
                        <h2>{props.titulo}</h2>
                        <p>{props.tempo}</p>
                    </div>
                    <div className="acoes">
                        <button className="btn-editar" onClick={props.onEditar}>Editar</button>
                        <button className="btn-excluir" onClick={props.onExcluir}>Excluir</button>
                    </div>
                </div>
            );
        }

   
        function App() {
            const handleEditar = () => {
                alert("Clicou em Editar!");
            };

            const handleExcluir = () => {
                alert("Clicou em Excluir!");
            };

            return (
                <CardAtividade 
                    titulo="Corrida leve" 
                    tempo="30 min" 
                    onEditar={handleEditar}
                    onExcluir={handleExcluir}
                />
            );
        }

       
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>

</body>
</html>
